[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MSB-GP"
version = "1.0.0"
description = "Multi-kernel sparse genomic prediction (MSB-GP)"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "MSB-GP developers" }]
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["msbgp"]
